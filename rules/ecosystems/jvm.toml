# Java / Kotlin (JVM) rules. Format: rules/README.md.
# The Gradle caches (`~/.gradle/caches`) and the Maven local repository (`~/.m2/repository`) are
# package caches located by Rust code in `scull_detectors::caches` (rule IDs `gradle.caches`,
# `maven.repository`), not rules (CLS-02). Both are inspect-only: neither tool has a command that
# cleans them (see `scull_detectors::jvm`).
#
# A build folder is only a candidate with the build file beside it AND entries only the build
# tool writes inside it (CLS-03): a `build/` or `target/` next to a build file but holding
# anything else is left alone. `./gradlew clean` and `mvn clean` delete these folders whole, so
# the tools treat them as their own.

schema_version = 1

[[rule]]
id = "gradle.build"
version = 1
artifact = "Gradle build output"
ecosystem = "jvm"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S0"
strategy = "filesystem"
evidence = ["marker", "known_artifact"]

[rule.match]
names = ["build"]

[rule.markers]
# A Gradle build script beside it, and what Gradle tasks write inside (`tmp/` task folders,
# compiled `classes/`, `libs/` jars, Kotlin and Android Gradle Plugin outputs, reports).
all = [
  "../{build.gradle,build.gradle.kts}",
  "{tmp,classes,libs,kotlin,intermediates,generated,reports,test-results,outputs}",
]

[rule.exclude]
# Another build system beside it may write `build/` too: ownership is ambiguous, leave it alone
# (FX-CLS-10: a CMake `build/` is never a Gradle candidate).
markers = [
  "../{CMakeLists.txt,meson.build,package.json,setup.py,pyproject.toml,Makefile}",
]
within = ["node_modules"]

[rule.activity]
# The Gradle daemon and the Kotlin compile daemon run as `java`.
processes = ["gradle", "gradlew", "java"]

[rule.regeneration]
instructions = "Run `./gradlew build` (or `gradle build`) in the project to rebuild."
# Rebuilt from the project's sources (dependencies come from the Gradle cache).
network = false
long_build = false

[[rule]]
id = "gradle.project-cache"
version = 1
artifact = "Gradle project cache"
ecosystem = "jvm"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S0"
strategy = "filesystem"
evidence = ["marker", "known_artifact"]

[rule.match]
names = [".gradle"]

[rule.markers]
# A Gradle build beside it, and Gradle's per-project state inside.
all = [
  "../{settings.gradle,settings.gradle.kts,build.gradle,build.gradle.kts}",
  "{buildOutputCleanup,vcs-1,file-system.probe,checksums,configuration-cache}",
]

[rule.exclude]
# The Gradle user home (`~/.gradle`: caches, wrapper distributions, daemon logs) is never a
# project cache, even with a build script beside it.
markers = ["{caches,wrapper,daemon,native,jdks}"]
within = ["node_modules"]

[rule.activity]
processes = ["gradle", "gradlew", "java"]

[rule.regeneration]
instructions = "Gradle recreates it on the next build (the first build is slower: no configuration cache or file hashes yet)."
network = false
long_build = false

[[rule]]
id = "maven.target"
version = 1
artifact = "Maven build output"
ecosystem = "jvm"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S0"
strategy = "filesystem"
evidence = ["marker", "known_artifact"]

[rule.match]
names = ["target"]

[rule.markers]
# The POM beside it, and what Maven plugins write inside.
all = [
  "../pom.xml",
  "{classes,test-classes,maven-status,maven-archiver,generated-sources,surefire-reports}",
]

[rule.exclude]
# Cargo, sbt and Leiningen also write `target/`: ownership is ambiguous (mirrors `rust.target`).
markers = ["../{Cargo.toml,build.sbt,project.clj}"]
within = ["node_modules"]

[rule.activity]
processes = ["mvn", "mvnd", "java"]

[rule.regeneration]
instructions = "Run `mvn package` (or `mvn install`) in the project to rebuild."
network = false
long_build = false

# ---------------------------------------------------------------------------------------------
# JVM extras: sbt, Bloop and Metals (P5-DET-05). The Coursier cache (used by sbt, Mill, Metals
# and `cs`) is located by Rust code in `scull_detectors::caches` (rule ID `coursier.cache`,
# inspect-only: Coursier has no command that cleans it).

[[rule]]
id = "sbt.target"
version = 1
artifact = "sbt build output"
ecosystem = "jvm"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S0"
strategy = "filesystem"
evidence = ["marker", "known_artifact"]

[rule.match]
names = ["target"]

[rule.markers]
# The sbt build definition beside it, and what sbt writes inside.
all = ["../build.sbt"]
any = ["streams", "task-temp-directory", "global-logging", "scala-*"]

[rule.exclude]
# Cargo, Maven and Leiningen also write `target/` (mirrors `maven.target`).
markers = ["../{Cargo.toml,pom.xml,project.clj}"]
within = ["node_modules"]

[rule.activity]
processes = ["sbt", "java", "bloop", "metals"]

[rule.regeneration]
instructions = "Run `sbt compile` (or `sbt package`) in the project to rebuild."
network = false
long_build = false

[[rule]]
id = "sbt.project-target"
version = 1
artifact = "sbt build definition output (project/target)"
ecosystem = "jvm"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S0"
strategy = "filesystem"
evidence = ["marker", "known_artifact"]

[rule.match]
names = ["target"]

[rule.markers]
# `project/target`: the compiled build definition, beside `project/build.properties`, with the
# project's `build.sbt` one level up.
all = ["../build.properties", "../../build.sbt"]
any = ["config-classes", "streams", "scala-*"]

[rule.exclude]
markers = ["../{Cargo.toml,pom.xml,project.clj}"]
within = ["node_modules"]

[rule.activity]
processes = ["sbt", "java", "bloop", "metals"]

[rule.regeneration]
instructions = "sbt compiles the build definition again when it next starts in the project."
network = false
long_build = false

[[rule]]
id = "bloop.dir"
version = 1
artifact = "Bloop build server folder"
ecosystem = "jvm"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S1"
strategy = "filesystem"
evidence = ["marker", "known_artifact"]

[rule.match]
names = [".bloop"]

[rule.markers]
# A JVM build beside it, and the per-project JSON configurations Bloop reads inside.
all = [
  "../{build.sbt,build.sc,build.mill,build.gradle,build.gradle.kts,pom.xml}",
  "*.json",
]

[rule.exclude]
within = ["node_modules"]

[rule.activity]
processes = ["bloop", "java", "metals"]

[rule.regeneration]
instructions = "Import the build again (Metals: \"Import build\"; sbt: `sbt bloopInstall`). Bloop then recompiles the projects."
network = false
long_build = true

[[rule]]
id = "metals.dir"
version = 1
artifact = "Metals language server folder"
ecosystem = "jvm"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S1"
strategy = "filesystem"
evidence = ["marker", "known_artifact"]

[rule.match]
names = [".metals"]

[rule.markers]
# A Scala build beside it, and Metals' database or log inside.
all = [
  "../{build.sbt,build.sc,build.mill,project.scala,build.gradle,build.gradle.kts,pom.xml}",
  "{metals.mv.db,metals.lock.db,metals.log}",
]

[rule.exclude]
within = ["node_modules"]

[rule.activity]
processes = ["metals", "java"]

[rule.regeneration]
instructions = "Metals recreates it when the project is next opened (it asks again which build tool or server to use, and re-indexes)."
network = false
long_build = true
