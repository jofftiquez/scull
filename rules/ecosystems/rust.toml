# Rust ecosystem rules. Format: rules/README.md.
# Shared CARGO_TARGET_DIR and Cargo registry/git caches need a Rust detector (CLS-02), not a rule.

schema_version = 1

[[rule]]
id = "rust.target"
version = 1
artifact = "Cargo build output"
ecosystem = "rust"
category = "project_artifact"
platforms = ["macos", "linux", "windows"]
base_tier = "S0"
strategy = "filesystem"
evidence = ["marker", "lockfile", "known_artifact"]

[rule.match]
names = ["target"]

[rule.markers]
all = ["../Cargo.toml"]

[rule.lockfiles]
any = ["../Cargo.lock"]

[rule.exclude]
# Another build tool also writes `target/` here; ownership is ambiguous, so leave it alone.
markers = ["../pom.xml", "../build.sbt"]

[rule.activity]
processes = ["cargo", "rustc", "rust-analyzer"]
lock_files = ["debug/.cargo-lock", "release/.cargo-lock"]

[rule.regeneration]
instructions = "Run `cargo build` in the project to rebuild."
