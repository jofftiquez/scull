[package]
name = "scull-cli"
description = "scull: a safe developer storage analyzer and cleanup tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/jofftiquez/scull"
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
scull-core.workspace = true
scull-platform.workspace = true
scull-scanner.workspace = true
scull-detectors.workspace = true
scull-git.workspace = true
scull-safety.workspace = true
scull-storage.workspace = true
# Phase 2 (phase2 branch, D-33): the single deletion path, used by `scull data purge` (and
# later `scull clean`). On `main` the inspect-only alpha forbids this dependency; merging
# phase2 into main needs the alpha gate decision (crates/scull-cleaner/tests/delete_feature.rs,
# packaging/check_inspect_only.py).
scull-cleaner.workspace = true
scull-mcp.workspace = true
# `scull ask` (optional, off by default): the only crate here that talks to a network endpoint.
scull-ask = { path = "../scull-ask" }
scull-engine.workspace = true
scull-proactive.workspace = true
scull-insights.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
schemars.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
ctrlc = "3.5"
unicode-width = "0.2"

toml = "1"
# Validates a remote `scull scan --json` report against the published schema (`scan --ssh`).
jsonschema = { version = "0.60", default-features = false }
# Format-preserving edits of client TOML configs (`scull agent install codex`).
toml_edit = "0.25"

[dev-dependencies]
proptest.workspace = true
scull-fixtures.workspace = true
scull-insights = { workspace = true, features = ["fixtures"] }
# The desktop bridge, for the cross-surface forecast test (tests/forecast_surfaces.rs) only.
scull-desktop-bridge = { path = "../../apps/desktop/bridge" }
# Tests only: seed quarantine manifest rows (no public writer before #71) and a newer schema.
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3"

[[bin]]
name = "scull"
path = "src/main.rs"

# `scull clean caches` end to end: the test executable doubles as fake package managers, so it
# needs its own `main` (see tests/clean_caches/main.rs).
[[test]]
name = "clean_caches"
path = "tests/clean_caches/main.rs"
harness = false

# Release packaging (P1-REL-01): the workspace is `publish = false` (nothing goes to
# crates.io), which cargo-dist reads as "not distributable" unless opted in here. Only this
# crate ships a binary; config lives in dist-workspace.toml.
[package.metadata.dist]
dist = true
