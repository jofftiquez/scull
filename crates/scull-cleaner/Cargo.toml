[package]
name = "scull-cleaner"
description = "The scull Executor: the only code that deletes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
scull-core.workspace = true
# `delete`: the removal walker. This crate is the only one allowed to enable it (SAFE-10;
# checked by tests/delete_feature.rs).
scull-platform = { workspace = true, features = ["delete"] }
scull-safety.workspace = true
# Read-only pipeline, used to re-derive candidates at revalidation (SAFE-05, SAFE-11).
scull-engine.workspace = true
scull-git.workspace = true
serde_json.workspace = true
scull-storage.workspace = true
# Headroom (PRO-06): the reserve's layout, limits and manifest (read-only side).
scull-proactive.workspace = true
# The headroom reserve's random marker (PRO-06).
getrandom = "0.3"
schemars.workspace = true
serde.workspace = true
# Quick Clean (P2-QC-01): located caches and their commands, cache sizes, cancellation, and a
# private sandbox folder for the sanitized tool environment.
scull-detectors.workspace = true
scull-scanner.workspace = true
tempfile = "3"

[features]
# The Executor's bare per-item calls (`delete`, `delete_observed`, `trash`, `trash_checked`):
# no operation, journal, audit, revalidation or watermark. For this crate's and the fixtures'
# tests only; without it they are crate-private, so a frontend can reach deletion only through
# `execute_plan` and the operations (SAFE-10, #111 review). No frontend enables it.
bare-api = []

[dev-dependencies]
# This crate's own integration tests exercise the bare calls.
scull-cleaner = { path = ".", features = ["bare-api"] }
scull-fixtures.workspace = true
serde_json.workspace = true

# Quick Clean fixtures: the test executable doubles as fake `npm`/`pnpm`/`bun`/`yarn`, so it
# needs its own `main` (see tests/quickclean/main.rs).
[[test]]
name = "quickclean"
path = "tests/quickclean/main.rs"
harness = false
