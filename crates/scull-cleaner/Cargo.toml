[package]
name = "scull-cleaner"
description = "The scull Executor: the only code that deletes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
scull-core.workspace = true
# `delete`: the removal walker. This crate is the only one allowed to enable it (SAFE-10;
# checked by tests/delete_feature.rs).
scull-platform = { workspace = true, features = ["delete"] }
scull-safety.workspace = true
scull-storage.workspace = true

[dev-dependencies]
scull-fixtures.workspace = true
