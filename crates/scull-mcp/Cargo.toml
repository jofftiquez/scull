[package]
name = "scull-mcp"
description = "Read-only MCP server for scull (stdio)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

# Read-only by construction (SAFE-10): never depends on scull-cleaner. Checked by
# `cargo tree -p scull-mcp -e normal | grep cleaner` (prints nothing) and by a test.
[dependencies]
scull-core.workspace = true
scull-platform.workspace = true
scull-scanner.workspace = true
scull-detectors.workspace = true
scull-git.workspace = true
scull-storage.workspace = true
scull-engine.workspace = true
scull-proactive.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
# The official Rust MCP SDK (Apache-2.0), pinned exactly (MCP-02). Server + stdio transport
# only: no HTTP, no network listener (MCP-01).
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "io-std", "sync", "time"] }

[dev-dependencies]
scull-fixtures.workspace = true
scull-safety.workspace = true
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "client", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "io-std", "io-util", "sync", "time", "macros"] }
tempfile = "3"
proptest.workspace = true
jsonschema = { version = "0.60", default-features = false }
