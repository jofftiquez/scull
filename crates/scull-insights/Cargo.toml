[package]
name = "scull-insights"
description = "Local insights for scull: growth, regrowth, duplication, agent footprint, accuracy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Seeded demo histories for tests, screenshots and the desktop mock bridge. The shipped binary
# never enables it.
fixtures = []

[dependencies]
scull-core.workspace = true
scull-storage.workspace = true
scull-proactive.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
# The crate's own demo histories in its tests.
scull-insights = { path = ".", features = ["fixtures"] }
tempfile = "3"

[[example]]
name = "seed_demo"
required-features = ["fixtures"]
