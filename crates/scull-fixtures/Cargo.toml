[package]
name = "scull-fixtures"
description = "Test fixture builders, canaries and invariants for scull."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
scull-core.workspace = true
sha2.workspace = true
tempfile = "3"

# End-to-end fixtures (tests/) drive the real pipeline pieces. Dev-dependencies only, so crates
# that dev-depend on scull-fixtures get no cycle.
[dev-dependencies]
scull-platform.workspace = true
scull-scanner.workspace = true
scull-detectors.workspace = true
scull-git.workspace = true
scull-safety.workspace = true
# Output escaping and argument parsing for FX-FS-09/10/13 (a dev-dependency: scull-cli itself
# dev-depends on scull-fixtures).
scull-cli = { path = "../scull-cli" }
# FX-FS-04 / FX-FS-15 (nightly): the shared read-only pipeline, which alone checks the mount
# table for same-device bind mounts.
scull-engine.workspace = true
serde_json.workspace = true
