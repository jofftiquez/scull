name: Policy

# Linux-only policy checks (cheap). Required alongside "CI ok" once branch protection is on.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: catch new RustSec advisories on unchanged code
  workflow_dispatch:

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    # P1-CI-02 / D-2 / T-54: licenses (no copyleft), RustSec advisories (the cargo-audit DB),
    # yanked crates, unknown registries/git sources.
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  cli-deps:
    # P1-REL-01 / PLT-05: `cargo build -p scull-cli` must not pull in Tauri or
    # webview crates (the CLI and MCP install without the desktop). Metadata only, no build.
    name: cli-deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: scull-cli has no Tauri/webview crates (all targets)
        run: python3 packaging/check_inspect_only.py deps
      - name: Self-test the inspect-only gate (consent and metadata-only rules)
        run: python3 packaging/test_check_inspect_only.py
      - name: Self-test the release packaging (CycloneDX SBOM, Scoop manifest)
        run: python3 packaging/test_release_packaging.py

  platform-boundary:
    # P1-CI-03 / PLT-11: no OS APIs outside crates/scull-platform.
    name: platform-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: python3 scripts/ci/test_platform_boundary.py
      - name: Check the workspace
        run: python3 scripts/ci/platform_boundary.py

  release-versions:
    # P4-REL-01: one tag releases the CLI, MCP and desktop, so every version string must agree
    # (scripts/release/bump_version.py); plus the release scripts' self-tests.
    name: release-versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every version agrees (Cargo workspace, Tauri crate, tauri.conf.json, package.json)
        run: python3 scripts/release/bump_version.py --check
      - name: Self-test the release scripts (version bump, changelog draft)
        run: python3 scripts/release/test_release_scripts.py
