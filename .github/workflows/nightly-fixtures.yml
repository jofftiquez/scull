name: diag-91 macOS scan profile
# Throwaway diagnostic for #91 (scratch branch only; never merged).
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-91
      - name: Hardware
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.physicalcpu hw.memsize
          df -h "$RUNNER_TEMP"
      - name: Build (branch and main scanner example, branch tests)
        run: |
          cargo build --release --locked -p scull-scanner --example scan
          cp target/release/examples/scan "$RUNNER_TEMP/scan-branch"
          git worktree add -q "$RUNNER_TEMP/main" origin/main
          (cd "$RUNNER_TEMP/main" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --locked -p scull-scanner --example scan)
          cp target/release/examples/scan "$RUNNER_TEMP/scan-main"
          cargo test -p scull-fixtures --release --locked --test fx_fs_nightly --no-run
      - name: Bare scanner A/B on a generated 1M tree
        run: |
          python3 scripts/bench/gen_tree.py "$RUNNER_TEMP/tree" --entries 1000000 >/dev/null
          T="$RUNNER_TEMP/tree"
          for b in main branch main branch; do echo "== $b"; "$RUNNER_TEMP/scan-$b" "$T" --runs 2 | tail -2; done
          for n in 1 2 3 4 6 8 16; do echo "== branch threads=$n"; "$RUNNER_TEMP/scan-branch" "$T" --threads $n --runs 2 | tail -1; done
          for n in 1 3 6; do echo "== main threads=$n"; "$RUNNER_TEMP/scan-main" "$T" --threads $n --runs 2 | tail -1; done
          echo "== branch --listings"; "$RUNNER_TEMP/scan-branch" "$T" --listings --runs 2 | tail -1
          rm -rf "$T"
      - name: FX-FS-15 with sample(1) on the scan children
        run: |
          cargo test -p scull-fixtures --release --locked --test fx_fs_nightly -- \
            --ignored --nocapture --test-threads=1 fx_fs_15 > fs15.log 2>&1 &
          T=$!
          mkdir -p prof
          while kill -0 $T 2>/dev/null; do
            if grep -q "I-3 baseline snapshot" fs15.log; then
              for pid in $(pgrep -f "fx_fs_nightly-.*fx_fs_15_one_million"); do
                if [ ! -e "prof/$pid.started" ]; then
                  touch "prof/$pid.started"
                  sample "$pid" 12 -mayDie -file "prof/$pid.txt" >/dev/null 2>&1 &
                fi
              done
            fi
            sleep 0.5
          done
          wait $T || true
          grep -E "FX-FS-15|test result" fs15.log
          for f in prof/*.txt; do
            [ -s "$f" ] || continue
            echo "################ $f"
            grep -m1 "Physical footprint" "$f" || true
            sed -n '/^Sort by top of stack/,$p' "$f" | head -45
            echo "---- call graph (top)"
            sed -n '/^Call graph:/,/^Total number in stack/p' "$f" | awk 'length($0) < 260' | head -140
          done
