name: CI

on:
  pull_request:
    paths-ignore: ["design/**", "docs/**", "tasks/**", "**/*.md"]
  push:
    branches: [main, phase2]
    paths-ignore: ["design/**", "docs/**", "tasks/**", "**/*.md"]
  schedule:
    - cron: "41 2 * * *" # nightly full 3-OS run on the default branch
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    # D-10 / PLT-07…11: macOS, Linux and Windows are first-class. To keep pull requests fast,
    # PRs run Linux only; every push to main/phase2, the nightly schedule and manual runs test
    # all three OSs, so a platform regression shows up on the branch within one merge.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Enable long paths and keep LF on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase2' || github.event_name == 'pull_request' }}
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        env:
          # Linux: the measured free-space tests (scull-cleaner tests/measure.rs) run strict on a
          # private tmpfs, re-running themselves as root in a private mount namespace
          # (`sudo -n unshare --mount`); required, so a missing privilege fails instead of
          # falling back to the shared volume. Ignored nightly fixtures are unaffected.
          SCULL_FIXTURES_ALLOW_SUDO: ${{ runner.os == 'Linux' && '1' || '' }}
          SCULL_FIXTURES_REQUIRE_PRIVILEGED: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace --locked --no-fail-fast
      - name: doc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # Single stable check name for branch protection: "CI ok".
  ok:
    name: CI ok
    if: always()
    needs: [fmt, test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo 'fmt: ${{ needs.fmt.result }}  test: ${{ needs.test.result }}'
          test '${{ needs.fmt.result }}' = success && test '${{ needs.test.result }}' = success
