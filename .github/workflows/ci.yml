name: CI

on:
  pull_request:
    paths-ignore: ["design/**", "docs/**", "tasks/**", "**/*.md"]
  push:
    branches: [main, phase2]
    paths-ignore: ["design/**", "docs/**", "tasks/**", "**/*.md"]
  schedule:
    - cron: "41 2 * * *" # nightly full 3-OS run on the default branch
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    # D-10 / PLT-07…11: macOS, Linux and Windows are supported. PRs run Linux only; every push to
    # main/phase2, the nightly schedule and manual runs test all three OSs. During the MVP push
    # (provisional maintainer decision, see docs/CI.md) Windows is ADVISORY: its job runs and
    # reports, but a Windows failure does not fail the workflow or block merges; failures are
    # filed as issues. Linux and macOS remain required.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - name: Enable long paths and keep LF on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase2' || github.event_name == 'pull_request' }}
      - name: Test prerequisites (macOS)
        # tmux drives a real terminal for the `scull approve --run` tests; a fixture's missing
        # prerequisite fails in CI (scull_fixtures::skip, #113), so install it.
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - name: clippy
        run: cargo clippy --workspace --all-targets --features scull-cli/full --locked -- -D warnings
      - name: test
        env:
          # Linux: the measured free-space tests (scull-cleaner tests/measure.rs) run strict on a
          # private tmpfs, re-running themselves as root in a private mount namespace
          # (`sudo -n unshare --mount`); required, so a missing privilege fails instead of
          # falling back to the shared volume. Ignored nightly fixtures are unaffected.
          SCULL_FIXTURES_ALLOW_SUDO: ${{ runner.os == 'Linux' && '1' || '' }}
          SCULL_FIXTURES_REQUIRE_PRIVILEGED: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace --features scull-cli/full --locked --no-fail-fast
      # The runners are elevated: scull refuses destructive MCP tools and `scull approve` there
      # (SAFE-14), so those tests skip themselves, and `clean`/`restore` tests add
      # `--allow-root`. Run them again as a standard user, where they must take the normal
      # user's path (a skip or an elevated process is a failure, #65).
      - name: Elevation-gated tests as a standard user (Windows)
        # Runs even when `test` failed elsewhere: its coverage is independent.
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: >-
          ./scripts/ci/run-as-standard-user.ps1
          -Tests scull-cli/mcp_approval,scull-cli/clean,scull-cli/clean_caches,scull-cli/history_restore,scull-fixtures/fx_out,scull-cli/auto_policies_check,scull-cli/ask,scull-desktop-bridge/cleanup
          -MustRun agent_plan_runs_only_after_the_human_approves,approve_prompt_shows_the_plan_and_needs_the_shown_code,approve_without_a_terminal_creates_no_machine_id,revoke_through_the_cli_stops_the_agent,clean,clean_caches,history_restore,fx_out,fx_out_03_cli_and_mcp_plan_identical_contents,fx_exec_15_check_previews_then_quarantines_and_restore_undoes_it,opted_in_ask_prepares_a_plan_and_tells_the_user_to_approve_it,cleanup_review_runs_exactly_the_chosen_items_through_the_executor,an_s0_item_is_deleted_and_the_rest_left_alone,a_narrowed_plan_keeps_the_reviewed_plans_lifetime
      - name: doc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --features scull-cli/full --locked

  # #142: the slim personal-MVP build (the default; `--no-default-features` keeps it explicit):
  # it builds, its tests pass, and it links none of the crates only the full command set needs. (scull-proactive stays: the
  # Executor's headroom reserve in scull-cleaner uses it.)
  slim:
    name: slim CLI build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: clippy (slim)
        run: cargo clippy -p scull-cli --no-default-features --all-targets --locked -- -D warnings
      - name: test (slim)
        run: |
          cargo build -p scull-cli --no-default-features --locked
          cargo test -p scull-cli --no-default-features --locked --no-fail-fast
      - name: no full-only crates linked
        run: |
          if cargo tree -p scull-cli --no-default-features -e normal,build --locked \
              | grep -E 'scull-(ask|mcp|insights) '; then
            echo "the slim build links a crate only the full command set needs" >&2
            exit 1
          fi

  # Single stable check name for branch protection: "CI ok".
  ok:
    name: CI ok
    if: always()
    needs: [fmt, test, slim]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo 'fmt: ${{ needs.fmt.result }}  test: ${{ needs.test.result }}  slim: ${{ needs.slim.result }}'
          test '${{ needs.fmt.result }}' = success && test '${{ needs.test.result }}' = success && test '${{ needs.slim.result }}' = success
